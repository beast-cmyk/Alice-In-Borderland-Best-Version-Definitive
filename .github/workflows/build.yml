name: Build mod jar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/gradle-8.14.3
          key: gradle-8.14.3
      - name: Get Gradle 8.14.3 (keeps trying if a download server is down)
        run: |
          G="$HOME/gradle-8.14.3/bin/gradle"
          for i in $(seq 1 15); do
            [ -x "$G" ] && break
            for url in \
              https://downloads.gradle.org/distributions/gradle-8.14.3-bin.zip \
              https://github.com/gradle/gradle-distributions/releases/download/v8.14.3/gradle-8.14.3-bin.zip \
              https://services.gradle.org/distributions/gradle-8.14.3-bin.zip; do
              echo "Trying $url"
              if curl -fsSL --connect-timeout 20 --max-time 300 -o "$RUNNER_TEMP/gradle.zip" "$url" && unzip -q -o "$RUNNER_TEMP/gradle.zip" -d "$HOME"; then
                break
              fi
            done
            rm -f "$RUNNER_TEMP/gradle.zip"
            [ -x "$G" ] && break
            echo "All download servers failed (try $i of 15). Waiting 30 seconds."
            sleep 30
          done
          [ -x "$G" ] || { echo "Could not download Gradle. Wait a while, then Re-run all jobs."; exit 1; }
      - name: Build
        run: ~/gradle-8.14.3/bin/gradle build --stacktrace
      - name: Keep only the mod jar
        run: rm -f build/libs/*-sources.jar
      - uses: actions/upload-artifact@v4
        with:
          name: dead-mans-hand
          path: build/libs/*.jar
      - name: Put the jar on the "jar" branch
        run: |
          mkdir out
          cp build/libs/*.jar out/
          cd out
          git init -q -b jar
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Built jar"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" jar
